<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102e32"><title>TLA+ Workbench</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true">◇</span> TLA<span class="plus">+</span> Workbench</div><div class="runtime"><i></i> Rust / WebAssembly</div><button id="guide">Quick reference</button></header>
<main><div class="crumb">Workspace <span>/</span> Model checking</div><section class="hero"><div><h1>Model workbench</h1><p>Edit a specification and explore its reachable states.</p></div><button id="run" class="primary">▷ &nbsp; Run model <kbd>⌘ ↵</kbd></button></section>
<div class="workspace"><aside class="panel"><div class="panelhead"><h2>Specifications</h2><button id="new" class="icon" title="New specification" aria-label="New specification">＋</button></div><nav id="files"></nav><label class="import">↥ &nbsp; Import .tla<input type="file" id="upload" accept=".tla,text/plain"></label></aside>
<section class="panel editor"><div class="panelhead"><h2><span class="fileicon">≡</span> <span id="filename"></span></h2><button class="icon" id="download" title="Download specification" aria-label="Download specification">⇩</button></div><div class="editarea"><div id="numbers" aria-hidden="true"></div><div class="code"><pre id="paint" aria-hidden="true"></pre><textarea aria-label="TLA+ specification editor" id="source" spellcheck="false" autocapitalize="off" wrap="off"></textarea></div></div><div class="editorfoot"><span>TLA+ source</span><span id="position"></span></div></section>
<section class="panel graph"><div class="panelhead"><h2>State graph</h2><span class="tag" id="graphcount"></span></div><div id="canvas"></div><div id="inspector" class="inspect"></div></section></div>
<section class="panel result"><div class="panelhead"><h2>Model checker</h2><button id="settings">⚙ &nbsp; Configuration</button></div><div id="summary" role="status">Loading WebAssembly…</div><div id="trace"></div></section>
<footer><span class="footmark">◇</span> TLA+ Workbench <span class="right">Browser-local execution</span></footer></main>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><div id="dialogbody"></div></dialog><script type="module" src="app.js"></script></body></html>
