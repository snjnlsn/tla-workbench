<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102e32"><title>TLA+ Workbench</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true">◇</span> TLA<span class="plus">+</span> Workbench</div><div class="runtime"><i></i> Rust / WebAssembly</div><button id="guide">Quick reference</button></header>
<main><div class="crumb">Workspace <span>/</span> <span id="projectCrumb"></span></div><section class="hero"><div><h1>Model workbench</h1><p>Edit your project’s models and try their transitions.</p></div><button id="run" class="primary">▷ &nbsp; Run model <kbd>⌘ ↵</kbd></button></section>
<div class="workspace"><aside class="panel projects"><div class="panelhead"><h2>Projects</h2><button id="newProject" class="sidebarAction">New project</button></div>
<div class="projectpick"><label for="projectList">Active project</label><select id="projectList"></select></div>
<div class="panelhead modulehead"><h2>Models</h2><button id="new" class="icon" title="New specification" aria-label="New specification">＋</button></div><button class="addFiles" id="addFiles" type="button">Add .tla / .cfg files</button><input type="file" id="upload" multiple accept=".tla,.cfg" hidden><nav id="files"></nav></aside>
<section class="panel editor"><div class="panelhead"><h2><span class="fileicon">≡</span> <span id="filename"></span></h2><button class="icon" id="download" title="Download specification" aria-label="Download specification">⇩</button></div><div class="editarea"><div id="numbers" aria-hidden="true"></div><div class="code"><pre id="paint" aria-hidden="true"></pre><textarea aria-label="TLA+ specification editor" id="source" spellcheck="false" autocapitalize="off" wrap="off"></textarea></div></div><div class="editorfoot"><span>TLA+ source</span><span id="position"></span></div></section>
<section class="panel graph"><div class="panelhead"><h2>State explorer</h2><span class="tag" id="graphcount"></span></div><div class="viewSwitch"><button id="runnerView" aria-pressed="true">Try a transition</button><button id="graphView" aria-pressed="false">State graph</button></div><div id="simulator"></div><div id="graphPane" hidden><div id="canvas"></div><div id="inspector" class="inspect"></div><div id="steps" class="inspect" hidden><button id="backState" type="button">Back</button><select id="successors" aria-label="Enabled transitions"></select><button id="stepState" type="button">Step</button></div></div></section></div>
<section class="panel result"><div class="panelhead"><h2>Model checker</h2><button id="settings">⚙ &nbsp; Configuration</button></div><div id="summary" role="status">Loading WebAssembly…</div><div id="trace"></div></section>
<p id="storageNotice" hidden></p><footer><span class="footmark">◇</span> TLA+ Workbench <span class="right">Browser-local execution</span></footer></main>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="Close">×</button></form><div id="dialogbody"></div></dialog><script type="module" src="app.js"></script></body></html>
